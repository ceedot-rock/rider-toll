app = "rider-tollkeeper"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  path = "/health"

# SQLite lives here. Create once before first deploy:
#   fly volumes create tollkeeper_data --region ewr --size 1
[[mounts]]
  source = "tollkeeper_data"
  destination = "/data"

[env]
  TOLLKEEPER_DB = "/data/tollkeeper.db"

# Set at deploy time (Ship):
#   fly secrets set STRIPE_WEBHOOK_SECRET=whsec_...   (from Stripe dashboard > Developers > Webhooks)
#   fly secrets set STRIPE_SECRET_KEY=sk_live_...     (only when a gate flips live and this
#                                                     service reports meter events)

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
